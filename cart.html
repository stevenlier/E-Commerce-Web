<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart - E-Commerce Store</title>
    <link rel="stylesheet" href="main.css"> <!-- Link to CSS -->
    <link rel="stylesheet" href="cart.css"> <!-- Cart-specific CSS -->
</head>
<body>
    <header>
        <div class="logo">
            <img src="logo.png" alt="WATCHER Logo">
            <span>WATCHER</span>
        </div>
        <nav>
            <ul>
                <li><a href="main.html">Home</a></li>
                <li><a href="products_page.html">Products</a></li>
                <li><a href="cart.html" id="cart-link">Cart (<span id="cart-count">0</span>)</a></li>
            </ul>
        </nav>
        <input type="text" placeholder="Search products..." id="search">
    </header>

    <main>
        <section class="cart">
            <h2>Your Cart</h2>
            <div id="cart-items">
                <!-- Cart items will be displayed here -->
            </div>
            <div class="cart-total">
                <p>Total: Rp<span id="cart-total">0.00</span></p>
                <button id="checkout-btn">Checkout</button>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2023 MyStore. All rights reserved.</p>
    </footer>

    <script src="script.js"></script> <!-- Link to JavaScript -->
</body>
</html>
